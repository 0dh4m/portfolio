<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio moved — 0dh4m</title>
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=https://0dh4m.github.io/">
  <link rel="canonical" href="https://0dh4m.github.io/">
  <meta name="theme-color" content="#070a12">
  <style>
    :root {
      --ink: #070a12;
      --majorelle: #2f5bff;
      --zellige: #12b5a5;
      --saffron: #e8b44a;
      --sand: #f3e7cf;
      --muted: #9aa7bd;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(900px 520px at 80% -10%, rgba(47, 91, 255, 0.22), transparent 62%),
        radial-gradient(700px 460px at -10% 60%, rgba(18, 181, 165, 0.14), transparent 60%),
        var(--ink);
      color: var(--sand);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .card {
      width: min(560px, 100%);
      padding: 44px 38px 38px;
      border: 1px solid rgba(243, 231, 207, 0.14);
      border-radius: 220px 220px 22px 22px;
      background: rgba(12, 18, 32, 0.72);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(232, 180, 74, 0.22);
      border-radius: 210px 210px 16px 16px;
      pointer-events: none;
    }

    .monogram {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--majorelle), var(--zellige));
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 12px 30px rgba(47, 91, 255, 0.35);
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--saffron);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 auto 26px;
      max-width: 400px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.7;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      background: var(--saffron);
      color: #0b1020;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    a.button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(232, 180, 74, 0.28);
    }

    .note {
      margin: 18px 0 0;
      color: rgba(154, 167, 189, 0.7);
      font-size: 0.72rem;
    }

    @media (prefers-reduced-motion: reduce) {
      a.button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="monogram" aria-hidden="true">AC</div>
    <p class="kicker">0dh4m · Rabat</p>
    <h1>This portfolio has moved.</h1>
    <p>
      The canonical site now lives at <strong>0dh4m.github.io</strong>, with the projects,
      demos and CVs in one place. You are being redirected.
    </p>
    <a class="button" href="https://0dh4m.github.io/">Go to 0dh4m.github.io →</a>
    <p class="note">If nothing happens, use the link above.</p>
  </main>

  <script>
    window.location.replace("https://0dh4m.github.io/");
  </script>
</body>
</html>
